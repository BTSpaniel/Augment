<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="160" height="160" role="img" aria-labelledby="augmentLogoTitle augmentLogoDesc">
  <title id="augmentLogoTitle">Augment local AI workspace logo</title>
  <desc id="augmentLogoDesc">A metallic letter A mark with cyan and magenta signal rails, workspace nodes, and a bright local assistant core.</desc>
  <defs>
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="tight" />
      <feGaussianBlur stdDeviation="20" result="wide" />
      <feMerge>
        <feMergeNode in="wide" />
        <feMergeNode in="tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="tight" />
      <feGaussianBlur stdDeviation="20" result="wide" />
      <feMerge>
        <feMergeNode in="wide" />
        <feMergeNode in="tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="metalLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1e29" />
      <stop offset="40%" stop-color="#2d3547" />
      <stop offset="70%" stop-color="#44506b" />
      <stop offset="100%" stop-color="#141721" />
    </linearGradient>

    <linearGradient id="metalRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11131a" />
      <stop offset="30%" stop-color="#242a38" />
      <stop offset="60%" stop-color="#374154" />
      <stop offset="100%" stop-color="#1b1f29" />
    </linearGradient>

    <linearGradient id="darkBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <linearGradient id="cyanCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003cd2" />
      <stop offset="60%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="magentaCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7700ee" />
      <stop offset="60%" stop-color="#ff00aa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="prismEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="34%" stop-color="#ffffff" />
      <stop offset="66%" stop-color="#ff00aa" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>

    <filter id="hotBloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="tight" />
      <feGaussianBlur stdDeviation="32" result="wide" />
      <feColorMatrix in="wide" type="matrix" values="1 0 0 0 0.12  0 1 0 0 0.04  0 0 1 0 0.28  0 0 0 1.2 0" result="tinted" />
      <feMerge>
        <feMergeNode in="tinted" />
        <feMergeNode in="tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="coreGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="42%" stop-color="#00f3ff" stop-opacity="0.18" />
      <stop offset="74%" stop-color="#ff00aa" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff00aa" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="nodeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="45%" stop-color="#00f3ff" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#ff00aa" stop-opacity="0.22" />
    </linearGradient>

    <style>
      .electric-line { animation: pulse 2.6s ease-in-out infinite; }
      .spark { animation: twinkle 3.4s ease-in-out infinite; transform-origin: center; }
      .signal-node { animation: nodePulse 4.2s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse {
        0%, 100% { opacity: 0.76; stroke-width: 9; }
        50% { opacity: 1; stroke-width: 13; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.28; transform: scale(0.75); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.58; transform: scale(0.96); }
        50% { opacity: 0.92; transform: scale(1.04); }
      }
    </style>
  </defs>

  <!-- Halo and outer signal rails -->
  <g transform="translate(0, -15)">
    <circle cx="500" cy="450" r="410" fill="url(#coreGlow)" opacity="0.88" />
    
    <polygon points="500,70 880,790 730,790 500,310 270,790 120,790" fill="#000000" opacity="0.5" filter="url(#neonCyan)" />
    <polygon points="500,60 895,795 725,795 500,300 275,795 105,795" fill="none" stroke="url(#prismEdge)" stroke-width="9" opacity="0.72" filter="url(#hotBloom)" />

    <polygon points="500,70 880,790 730,790 500,310 270,790 120,790" fill="#0c0e14" stroke="#232a3a" stroke-width="2" />

    <!-- Metallic body -->
    <polygon points="500,90 500,320 270,790 130,790" fill="url(#darkBase)" />
    <polygon points="480,130 420,250 240,610 165,765 245,765 415,435" fill="url(#metalLeft)" />
    <polygon points="415,435 245,765 220,765 390,435" fill="#59688c" opacity="0.35" />

    <polygon points="500,90 500,320 730,790 870,790" fill="url(#darkBase)" />
    <polygon points="520,130 580,250 760,610 835,765 755,765 585,435" fill="url(#metalRight)" />
    <polygon points="585,435 755,765 780,765 610,435" fill="#191d26" opacity="0.75" />

    <!-- Local assistant core -->
    <polygon points="500,320 660,640 340,640" fill="#020305" />
    <polygon points="500,345 635,615 365,615" fill="#06080c" />

    <polygon points="292,575 708,575 718,590 282,590" fill="#495573" />
    <polygon points="282,590 718,590 680,655 320,655" fill="url(#darkBase)" stroke="#000000" stroke-width="3" />
    <polygon points="340,605 660,605 645,635 355,635" fill="#010204" />
    
    <rect x="375" y="614" width="90" height="7" rx="3" fill="#00f3ff" opacity="0.65" filter="url(#neonCyan)" />
    <rect x="535" y="614" width="90" height="7" rx="3" fill="#ff00aa" opacity="0.65" filter="url(#neonMagenta)" />

    <g class="signal-node" filter="url(#hotBloom)">
      <circle cx="500" cy="575" r="34" fill="url(#nodeGlass)" stroke="#ffffff" stroke-width="3" opacity="0.82" />
      <path d="M 480,575 L 498,593 L 523,555" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    </g>

    <polygon points="230,510 295,420 315,490" fill="#151921" stroke="#293042" stroke-width="1.5" />
    <polygon points="230,510 200,560 275,540" fill="#323b50" />
    <polygon points="770,510 705,420 685,490" fill="#0b0d12" stroke="#1c202b" stroke-width="1.5" />
    <polygon points="770,510 800,560 725,540" fill="#1c202b" />

    <polygon points="425,135 575,135 545,190 455,190" fill="#11141e" stroke="#323b50" stroke-width="1.5" />
    <polygon points="435,145 565,145 545,180 455,180" fill="#040507" />
    <line x1="440" y1="160" x2="475" y2="160" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round" filter="url(#neonCyan)" />
    <line x1="560" y1="160" x2="525" y2="160" stroke="#ff00aa" stroke-width="3.5" stroke-linecap="round" filter="url(#neonMagenta)" />

    <!-- Tool-loop rails -->
    <path class="electric-line" d="M 485,105 L 248,555 L 143,765" fill="none" stroke="url(#cyanCore)" stroke-width="15" stroke-linecap="round" filter="url(#neonCyan)" />
    <path d="M 485,105 L 248,555 L 143,765" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 468,150 L 307,455 L 178,718" fill="none" stroke="#8fffff" stroke-width="4" stroke-linecap="round" opacity="0.62" filter="url(#hotBloom)" />

    <path class="electric-line" d="M 515,105 L 752,555 L 857,765" fill="none" stroke="url(#magentaCore)" stroke-width="15" stroke-linecap="round" filter="url(#neonMagenta)" />
    <path d="M 515,105 L 752,555 L 857,765" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 532,150 L 693,455 L 822,718" fill="none" stroke="#ff8be8" stroke-width="4" stroke-linecap="round" opacity="0.62" filter="url(#hotBloom)" />

    <g filter="url(#neonMagenta)">
      <polygon points="500,410 565,530 500,495 435,530" fill="#ff21cc" />
      <polygon points="500,410 500,495 435,530" fill="#ffffff" opacity="0.4" />
      <polygon points="500,410 565,530 500,495" fill="#1b0021" opacity="0.4" />
    </g>
    <polygon points="500,425 545,510 500,485 455,510" fill="#ffffff" opacity="0.8" />

    <g filter="url(#neonCyan)">
      <polygon points="500,15 530,75 470,75" fill="#00f3ff" />
      <polygon points="500,15 500,75 470,75" fill="#ffffff" opacity="0.55" />
    </g>
    <polygon points="500,30 515,70 485,70" fill="#ffffff" opacity="0.85" />
    <circle class="spark" cx="500" cy="18" r="8" fill="#ffffff" filter="url(#hotBloom)" />
    <circle class="spark" cx="382" cy="286" r="4" fill="#00f3ff" filter="url(#neonCyan)" />
    <circle class="spark" cx="618" cy="286" r="4" fill="#ff00aa" filter="url(#neonMagenta)" />
    <circle class="spark" cx="304" cy="690" r="3.5" fill="#ffffff" filter="url(#hotBloom)" />
    <circle class="spark" cx="696" cy="690" r="3.5" fill="#ffffff" filter="url(#hotBloom)" />

    <!-- Workspace nodes -->
    <g fill="none" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" filter="url(#neonCyan)">
      <path d="M 205,715 L 145,775 M 235,735 L 185,785" />
      <circle cx="145" cy="775" r="4.5" fill="#ffffff" />
      <circle cx="185" cy="785" r="4.5" fill="#ffffff" />
    </g>

    <g fill="none" stroke="#ff00aa" stroke-width="3" stroke-linecap="round" filter="url(#neonMagenta)">
      <path d="M 795,715 L 855,775 M 765,735 L 815,785" />
      <circle cx="855" cy="775" r="4.5" fill="#ffffff" />
      <circle cx="815" cy="785" r="4.5" fill="#ffffff" />
    </g>
  </g>
</svg>
