<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Augment futuristic neon logo</title>
  <desc id="desc">A luminous hexagonal neural core beside the word Augment, rendered with cyan and magenta futuristic gradients.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="44%" stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markStroke" x1="94" y1="48" x2="286" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="360" y1="78" x2="1030" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="42%" stop-color="#A5F3FC"/>
      <stop offset="72%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#F9A8D4"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-60" y="-60" width="1320" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blurA"/>
      <feGaussianBlur stdDeviation="14" result="blurB"/>
      <feMerge>
        <feMergeNode in="blurB"/>
        <feMergeNode in="blurA"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="34" fill="#050816"/>
  <rect width="1200" height="360" rx="34" fill="url(#grid)"/>
  <ellipse cx="223" cy="180" rx="244" ry="206" fill="url(#bgGlow)"/>
  <ellipse cx="832" cy="180" rx="438" ry="166" fill="#A855F7" fill-opacity="0.045"/>

  <g filter="url(#softShadow)">
    <path d="M190 42L307 111V249L190 318L73 249V111L190 42Z" fill="#0B1020" fill-opacity="0.88" stroke="url(#markStroke)" stroke-width="5"/>
    <path d="M190 78L276 129V231L190 282L104 231V129L190 78Z" stroke="url(#markStroke)" stroke-width="3" stroke-opacity="0.72"/>
    <path d="M190 114L245 147V213L190 246L135 213V147L190 114Z" fill="#111827" stroke="url(#markStroke)" stroke-width="3"/>
  </g>

  <g filter="url(#neon)">
    <circle cx="190" cy="180" r="20" fill="#E0F2FE"/>
    <circle cx="190" cy="180" r="9" fill="#22D3EE"/>
    <circle cx="139" cy="148" r="7" fill="#67E8F9"/>
    <circle cx="241" cy="148" r="7" fill="#A78BFA"/>
    <circle cx="139" cy="212" r="7" fill="#F472B6"/>
    <circle cx="241" cy="212" r="7" fill="#67E8F9"/>
    <path d="M190 180L139 148M190 180L241 148M190 180L139 212M190 180L241 212" stroke="url(#markStroke)" stroke-width="3" stroke-linecap="round"/>
    <path d="M139 148L241 148L241 212L139 212L139 148Z" stroke="url(#markStroke)" stroke-width="2" stroke-opacity="0.52"/>
  </g>

  <g filter="url(#neon)">
    <path d="M364 255L455 82H500L592 255H540L525 223H429L414 255H364ZM447 184H507L477 119L447 184Z" fill="url(#wordGradient)"/>
    <path d="M612 255V82H661V214H748V255H612Z" fill="url(#wordGradient)"/>
    <path d="M773 255V82H823L904 177V82H952V255H911L821 150V255H773Z" fill="url(#wordGradient)"/>
    <path d="M984 255V82H1117V123H1033V149H1109V188H1033V214H1122V255H984Z" fill="url(#wordGradient)"/>
  </g>

  <path d="M358 284H1125" stroke="url(#scanline)" stroke-width="2" stroke-linecap="round"/>
  <text x="364" y="311" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="8">LOCAL AGENTIC WORKSPACE</text>
  <path d="M56 328H1144" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1"/>
  <path d="M56 32H1144" stroke="#F472B6" stroke-opacity="0.14" stroke-width="1"/>
</svg>
