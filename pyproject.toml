[project]
name = "augment"
version = "0.1.0"
description = "Minimal LLM enhancer with CLI, HTTP chat, ReAct tools, context, and memory."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "h2>=4.1.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
  "requests>=2.32.0",
  "urllib3>=2.0.0,<3.0.0",
  "charset-normalizer>=3.0.0,<4.0.0"
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0"
]
web = [
  "ddgs>=9.0.0",
  "duckduckgo-search>=6.2.0",
  "crawl4ai>=0.4.0"
]
all = [
  "playwright>=1.45.0",
  "ddgs>=9.0.0",
  "duckduckgo-search>=6.2.0",
  "crawl4ai>=0.4.0"
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0"
]

[project.scripts]
augment = "augment.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
